# Echantillon des reglages generes par AxelL Linux Optimmisateur (Debian 13).
# Le fichier actif est ecrit dans /etc/linux-optimizer/sysctl-<profil>.conf
# puis valide par sysctl --load avant d'etre conserve.

fs.file-max = 1048576
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 4096
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_slow_start_after_idle = 1
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.rp_filter = 2
vm.swappiness = 10
vm.vfs_cache_pressure = 100

# Connexions TCP soutenues (valeurs prudentes, appliquees seulement si le
# noyau expose la cle, puis validees par sysctl --load)
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_rmem = 4096 87380 4194304
net.ipv4.tcp_wmem = 4096 16384 4194304
net.ipv4.ip_local_port_range = 1024 65535

# BBR et fq sont ajoutes uniquement si le noyau les expose.
# net.ipv4.tcp_congestion_control = bbr
# net.core.default_qdisc = fq

# Roles (extraits ajoutes selon le profil) :
# Docker : fs.inotify.max_user_instances = 1024 / fs.inotify.max_user_watches = 524288
# Web    : net.core.somaxconn = 8192
# Pterodactyl : net.ipv4.ip_forward = 1 / net.ipv6.conf.all.forwarding = 1
